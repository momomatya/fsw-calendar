<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>【非公式】FSW 会員走行カレンダー</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fc-event {
      cursor: pointer;
      font-size: 0.7rem;
      border: none !important;
      border-radius: 4px;
      padding: 1px 3px;
      margin-bottom: 2px;
    }
    .fc-event-title {
      font-weight: 600;
    }
    .fc-event-time {
      display: none !important;
    }
    .fc-list-event-time {
      display: none !important;
    }
    .fc-list-event-title {
      font-weight: bold;
      font-size: 0.9rem;
    }
    .fc-list-day-cushion {
      background-color: #f1f5f9 !important;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <div class="max-w-4xl mx-auto px-2 py-3 sm:p-6">
    <!-- ヘッダー -->
    <div class="mb-4 bg-slate-950 text-white p-3 sm:p-4 rounded-xl shadow-md border border-slate-800">
      <div class="flex items-center gap-3 sm:gap-4">
        <!-- 38 Racing ロゴ画像 -->
        <img src="logo.png" alt="38 Racing" class="h-11 sm:h-16 w-auto object-contain bg-black rounded p-0.5" onerror="this.style.display='none'">
        
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-base sm:text-xl font-bold flex items-center gap-1.5 text-white tracking-wide">
              🏁 FSW 走行枠カレンダー
            </h1>
            <span class="text-[10px] sm:text-xs bg-slate-800 text-slate-300 border border-slate-700 px-1.5 py-0.5 rounded font-medium">非公式</span>
          </div>
          <p class="text-[10px] sm:text-xs text-slate-400 font-medium mt-0.5">富士スピードウェイ レーシングコース（RC）</p>
        </div>
      </div>
    </div>

    <!-- 絞り込みフィルター -->
    <div class="flex items-center gap-1.5 overflow-x-auto pb-2 mb-2 no-scrollbar" id="filter-container">
      <button onclick="filterCategory('ALL')" id="btn-ALL" class="whitespace-nowrap px-3 py-1 text-xs rounded-full bg-slate-900 text-white shadow font-semibold">すべて</button>
      <button onclick="filterCategory('S-4')" id="btn-S-4" class="whitespace-nowrap px-3 py-1 text-xs rounded-full bg-white text-red-600 border border-slate-300 font-semibold">S-4</button>
      <button onclick="filterCategory('N-4')" id="btn-N-4" class="whitespace-nowrap px-3 py-1 text-xs rounded-full bg-white text-emerald-600 border border-slate-300 font-semibold">N-4</button>
      <button onclick="filterCategory('R-4')" id="btn-R-4" class="whitespace-nowrap px-3 py-1 text-xs rounded-full bg-white text-amber-600 border border-slate-300 font-semibold">R-4</button>
      <button onclick="filterCategory('L-4')" id="btn-L-4" class="whitespace-nowrap px-3 py-1 text-xs rounded-full bg-white text-pink-600 border border-slate-300 font-semibold">L-4</button>
    </div>

    <!-- カレンダー表示エリア -->
    <div class="bg-white p-2 sm:p-4 rounded-xl shadow-sm border border-slate-200">
      <div id="calendar"></div>
    </div>

    <!-- フッター免責事項 -->
    <footer class="mt-4 px-2 py-3 text-center">
      <p class="text-[11px] sm:text-xs text-slate-500 leading-relaxed max-w-2xl mx-auto">
        ※ 本カレンダーは有志による非公式の個人開発ツールです。富士スピードウェイ公式とは一切関係ありません。急なスケジュール変更等の可能性もあるため、走行前には必ず公式サイトの正式なスケジュールをご確認ください。
      </p>
      <p class="text-[10px] text-slate-400 mt-1">
        データ元：<a href="https://www.fsw.tv" target="_blank" rel="noopener noreferrer" class="underline hover:text-slate-600">富士スピードウェイ公式サイト</a>
      </p>
    </footer>
  </div>

  <script>
    let calendar;
    let allEvents = [];
    let currentFilter = 'ALL';

    function getEventColor(title) {
      if (title.includes('S-4')) return '#ef4444'; // 赤
      if (title.includes('N-4')) return '#10b981'; // 緑
      if (title.includes('R-4')) return '#f59e0b'; // オレンジ
      if (title.includes('L-4')) return '#ec4899'; // ピンク
      return '#64748b';
    }

    document.addEventListener('DOMContentLoaded', async function() {
      const calendarEl = document.getElementById('calendar');

      try {
        const res = await fetch('events.json?v=' + Date.now());
        allEvents = await res.json();
      } catch (e) {
        console.error('イベント取得エラー:', e);
      }

      const isMobile = window.innerWidth < 768;
      const defaultView = isMobile ? 'listMonth' : 'dayGridMonth';

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: defaultView,
        locale: 'ja',
        height: 'auto',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: isMobile ? 'listMonth,dayGridMonth' : 'dayGridMonth,timeGridWeek,listMonth'
        },
        buttonText: {
          today: '今月',
          month: '月',
          week: '週',
          list: 'リスト'
        },
        events: getFilteredEvents(),
        eventDidMount: function(info) {
          if (info.view.type.startsWith('dayGrid')) {
            info.el.style.backgroundColor = getEventColor(info.event.title);
          }
          if (info.view.type.startsWith('list')) {
            const dot = info.el.querySelector('.fc-list-event-dot');
            if (dot) {
              dot.style.borderColor = getEventColor(info.event.title);
            }
          }
        }
      });

      calendar.render();
    });

    function getFilteredEvents() {
      if (currentFilter === 'ALL') return allEvents;
      return allEvents.filter(ev => {
        const target = ev.raw_summary || ev.title;
        return target.includes(currentFilter);
      });
    }

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('#filter-container button').forEach(b => {
        b.className = "whitespace-nowrap px-3 py-1 text-xs rounded-full bg-white text-slate-700 border border-slate-300 font-semibold";
      });
      const activeBtn = document.getElementById('btn-' + cat);
      if (activeBtn) {
        activeBtn.className = "whitespace-nowrap px-3 py-1 text-xs rounded-full bg-slate-900 text-white shadow font-semibold";
      }
      calendar.removeAllEvents();
      calendar.addEventSource(getFilteredEvents());
    }
  </script>
</body>
</html>
