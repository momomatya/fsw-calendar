<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FSW 会員走行カレンダー</title>
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .header {
      max-width: 1100px;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0;
      font-weight: 700;
    }
    .calendar-container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .fc-event {
      cursor: pointer;
      font-size: 0.82rem;
      padding: 2px 4px;
      border-radius: 4px;
      border: none;
    }
    /* クラス別のカラーリング */
    .event-s { background-color: #ef4444 !important; }
    .event-ns { background-color: #3b82f6 !important; }
    .event-n { background-color: #10b981 !important; }
    .event-r { background-color: #f59e0b !important; }
    .event-other { background-color: #64748b !important; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🏁 FSW 会員走行枠カレンダー</h1>
    <div>
      <a href="fsw_calendar.ics" style="font-size: 0.9rem; color: #2563eb; text-decoration: none;">📥 iCal (.ics) をダウンロード</a>
    </div>
  </div>

  <div class="calendar-container">
    <div id="calendar"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: window.innerWidth < 768 ? 'timeGridDay' : 'dayGridMonth',
        locale: 'ja',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: {
          today: '今日',
          month: '月',
          week: '週',
          day: '日'
        },
        events: 'events.json',
        eventClassNames: function(arg) {
          const title = arg.event.title.toUpperCase();
          if (title.includes('NS-4')) return ['event-ns'];
          if (title.includes('S-4')) return ['event-s'];
          if (title.includes('N-4')) return ['event-n'];
          if (title.includes('R-4')) return ['event-r'];
          return ['event-other'];
        },
        eventClick: function(info) {
          alert(info.event.title + '\n時間: ' + info.event.start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ' - ' + info.event.end.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
        }
      });
      calendar.render();
    });
  </script>
</body>
</html>
